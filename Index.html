<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PWA Chat Notes Sync</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; background: #e5ddd5; }
        #auth-panel { background: #075e54; color: white; padding: 10px; display: flex; justify-content: space-between; align-items: center; }
        #chat-container { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { background: white; padding: 10px; border-radius: 8px; max-width: 70%; align-self: flex-start; box-shadow: 0 1px 1px rgba(0,0,0,0.1); word-break: break-word; }
        .msg img { max-width: 100%; border-radius: 5px; margin-top: 5px; }
        .msg a { color: #0275d8; display: block; margin-top: 5px; }
        #input-panel { display: flex; padding: 10px; background: #f0f0f0; gap: 10px; align-items: center; }
        #text-input { flex: 1; padding: 10px; border-radius: 20px; border: 1px solid #ccc; outline: none; }
        button { background: #075e54; color: white; border: none; padding: 10px 15px; border-radius: 20px; cursor: pointer; }
        #file-input { display: none; }
        .btn-file { background: #128c7e; }
    </style>
</head>
<body>

    <div id="auth-panel">
        <strong>PWA Chat Notas</strong>
        <div>
            <button id="btn-login" onclick="handleAuthClick()">Conectar Drive</button>
            <button id="btn-sync" onclick="syncWithDrive()" style="display:none;">🔄 Sincronizar</button>
        </div>
    </div>

    <div id="chat-container"></div>

    <div id="input-panel">
        <button class="btn-file" onclick="document.getElementById('file-input').click()">📷</button>
        <input type="file" id="file-input" accept="image/*" onchange="handleImage(this)">
        <input type="text" id="text-input" placeholder="Escribe una nota o pega un link..." onkeypress="checkEnter(event)">
        <button onclick="addTextNote()">Enviar</button>
    </div>

    <!-- Scripts de Google API -->
    <script src="https://google.com" async defer></script>
    
    <script>
        // CLIENT CONFIGURATION (Reemplaza con tus datos de Google Cloud)
        const CLIENT_ID = 'TU_ID_DE_CLIENTE_DE_://googleusercontent.com';
        const SCOPES = 'https://googleapis.com';

        let db;
        let tokenClient;
        let accessToken = null;

        // 1. INICIALIZAR INDEXEDDB
        const request = indexedDB.open("ChatNotesDB", 1);
        request.onupgradeneeded = (e) => {
            db = e.target.result;
            db.createObjectStore("notes", { keyPath: "id" });
        };
        request.onsuccess = (e) => {
            db = e.target.result;
            renderNotes();
            initGoogleAuth();
        };

        // Guardar nota local
        function saveLocal(note) {
            const tx = db.transaction("notes", "readwrite");
            tx.objectStore("notes").put(note);
            tx.oncomplete = () => renderNotes();
        }

        // Renderizar notas en pantalla
        function renderNotes() {
            const container = document.getElementById("chat-container");
            container.innerHTML = "";
            const tx = db.transaction("notes", "readonly");
            tx.objectStore("notes").getAll().onsuccess = (e) => {
                const notes = e.target.result.sort((a,b) => a.id - b.id);
                notes.forEach(note => {
                    const div = document.createElement("div");
                    div.className = "msg";
                    
                    if (note.text) div.innerHTML += `<div>${note.text}</div>`;
                    if (note.link) div.innerHTML += `<a href="${note.link}" target="_blank">${note.link}</a>`;
                    if (note.image) div.innerHTML += `<img src="${note.image}" />`;
                    
                    container.appendChild(div);
                });
                container.scrollTop = container.scrollHeight;
            };
        }

        // 2. ACCIONES DE NOTAS
        function addTextNote() {
            const input = document.getElementById("text-input");
            const text = input.value.trim();
            if (!text) return;

            const urlRegex = /(https?:\/\/[^\s]+)/g;
            const hasLink = text.match(urlRegex);

            const note = {
                id: Date.now(),
                text: text,
                link: hasLink ? hasLink[0] : null,
                image: null
            };

            saveLocal(note);
            input.value = "";
        }

        function checkEnter(e) { if (e.key === 'Enter') addTextNote(); }

        function handleImage(input) {
            const file = input.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const note = {
                    id: Date.now(),
                    text: "Imagen enviada",
                    link: null,
                    image: e.target.result // Base64 string
                };
                saveLocal(note);
            };
            reader.readAsDataURL(file);
        }

        // 3. AUTENTICACIÓN GOOGLE DRIVE
        function initGoogleAuth() {
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID,
                scope: SCOPES,
                callback: (tokenResponse) => {
                    if (tokenResponse.error !== undefined) { throw (tokenResponse); }
                    accessToken = tokenResponse.access_token;
                    document.getElementById("btn-login").style.display = "none";
                    document.getElementById("btn-sync").style.display = "inline-block";
                    syncWithDrive(); // Sincroniza al iniciar sesión
                },
            });
        }

        function handleAuthClick() {
            // Solicita el token (abrirá el popup de Google)
            tokenClient.requestAccessToken({prompt: 'consent'});
        }

        // 4. SINCRONIZACIÓN CON GOOGLE DRIVE (App Data Folder)
        async function syncWithDrive() {
            if (!accessToken) return alert("Primero conéctate a Google Drive");
            document.getElementById("btn-sync").innerText = "🔄 Sincronizando...";

            // Obtener todas las notas locales
            const tx = db.transaction("notes", "readonly");
            tx.objectStore("notes").getAll().onsuccess = async (e) => {
                const localNotes = e.target.result;
                
                try {
                    // Buscar si ya existe el archivo 'backup.json' en la carpeta appDataFolder
                    const searchUrl = "https://googleapis.com";
                    const response = await fetch(searchUrl, { headers: { 'Authorization': `Bearer ${accessToken}` } });
                    const result = await response.json();
                    
                    let fileId = result.files.length > 0 ? result.files[0].id : null;
                    let cloudNotes = [];

                    if (fileId) {
                        // Si existe, descargar el archivo de la nube
                        const downloadUrl = `https://googleapis.com{fileId}?alt=media`;
                        const dlResponse = await fetch(downloadUrl, { headers: { 'Authorization': `Bearer ${accessToken}` } });
                        cloudNotes = await dlResponse.json();
                    }

                    // Fusión simple basada en IDs (Timestamp)
                    const notesMap = new Map();
                    cloudNotes.forEach(n => notesMap.set(n.id, n));
                    localNotes.forEach(n => notesMap.set(n.id, n));
                    const mergedNotes = Array.from(notesMap.values());

                    // Guardar de vuelta en la base de datos local lo sincronizado
                    const writeTx = db.transaction("notes", "readwrite");
                    mergedNotes.forEach(n => writeTx.objectStore("notes").put(n));
                    
                    // Subir los datos combinados a Google Drive
                    const metadata = { name: 'backup.json', parents: ['appDataFolder'] };
                    const boundary = 'foo_bar_baz';
                    
                    let method = 'POST';
                    let uploadUrl = 'https://googleapis.com';
                    
                    if (fileId) {
                        method = 'PATCH';
                        uploadUrl = `https://googleapis.com{fileId}?uploadType=multipart`;
                    }

                    const multipartRequestBody =
                        `\r\n--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}` +
                        `\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(mergedNotes)}` +
                        `\r\n--${boundary}--`;

                    await fetch(uploadUrl, {
                        method: method,
                        headers: {
                            'Authorization': `Bearer ${accessToken}`,
                            'Content-Type': `multipart/related; boundary=${boundary}`
                        },
                        body: multipartRequestBody
                    });

                    renderNotes();
                    document.getElementById("btn-sync").innerText = "✅ Sincronizado";
                } catch (err) {
                    console.error(err);
                    alert("Error durante la sincronización");
                    document.getElementById("btn-sync").innerText = "🔄 Sincronizar";
