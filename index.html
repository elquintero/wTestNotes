<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#075e54">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <title>PWA Chat Notas</title>
    <style>
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body { font-family: Arial, sans-serif; margin: 0; display: flex; flex-direction: column; background: #e5ddd5; }
        #auth-panel { background: #075e54; color: white; padding: 10px; display: flex; justify-content: space-between; align-items: center; }
        #chat-container { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { background: white; padding: 10px; border-radius: 8px; max-width: 70%; align-self: flex-start; box-shadow: 0 1px 1px rgba(0,0,0,0.1); word-break: break-word; }
        .msg img { max-width: 100%; border-radius: 5px; margin-top: 5px; display: block; }
        .msg a { color: #0275d8; display: block; margin-top: 5px; }
        #input-panel { display: flex; padding: 10px; background: #f0f0f0; gap: 10px; align-items: center; }
        #text-input { flex: 1; padding: 10px; border-radius: 20px; border: 1px solid #ccc; outline: none; min-width: 0; }
        button { background: #075e54; color: white; border: none; padding: 10px 15px; border-radius: 20px; cursor: pointer; }
        button:disabled { opacity: .6; cursor: default; }
        #file-input { display: none; }
        .btn-file { background: #128c7e; }
    </style>
</head>
<body>

    <div id="auth-panel">
        <div><strong>PWA Chat Notas</strong><div id="status" style="font-size:11px;opacity:.85;">Sin conectar</div></div>
        <div>
            <button id="btn-login">Conectar Drive</button>
            <button id="btn-sync" style="display:none;">🔄 Sincronizar</button>
        </div>
    </div>

    <div id="chat-container"></div>

    <div id="input-panel">
        <button class="btn-file" id="btn-file">📷</button>
        <input type="file" id="file-input" accept="image/*">
        <input type="text" id="text-input" placeholder="Escribe una nota o pega un link...">
        <button id="btn-send">Enviar</button>
    </div>

    <script>
        // ===== CONFIGURACIÓN =====
        const CLIENT_ID = '502253443882-ln7cauqdm88k6ndnh7ct455nbnarqij6.apps.googleusercontent.com';
        const SCOPES = 'https://www.googleapis.com/auth/drive.appdata';
        const DRIVE = 'https://www.googleapis.com/drive/v3';
        const UPLOAD = 'https://www.googleapis.com/upload/drive/v3';

        let db;
        let tokenClient;
        let accessToken = null;
        let syncing = false;

        // ===== Utilidades =====
        const $ = (id) => document.getElementById(id);

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }
        function isSafeUrl(u) { return /^https?:\/\//i.test(u); }

        // ===== IndexedDB (promesas) =====
        function openDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open("ChatNotesDB", 1);
                req.onupgradeneeded = (e) => {
                    const d = e.target.result;
                    if (!d.objectStoreNames.contains("notes")) d.createObjectStore("notes", { keyPath: "id" });
                };
                req.onsuccess = (e) => resolve(e.target.result);
                req.onerror = () => reject(req.error);
            });
        }
        function getAllNotes() {
            return new Promise((resolve, reject) => {
                const req = db.transaction("notes", "readonly").objectStore("notes").getAll();
                req.onsuccess = () => resolve(req.result || []);
                req.onerror = () => reject(req.error);
            });
        }
        function putNotes(notes) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction("notes", "readwrite");
                const store = tx.objectStore("notes");
                notes.forEach(n => store.put(n));
                tx.oncomplete = () => resolve();
                tx.onerror = () => reject(tx.error);
                tx.onabort = () => reject(tx.error);
            });
        }

        // ===== Render =====
        async function renderNotes() {
            const container = $("chat-container");
            const notes = (await getAllNotes()).sort((a, b) => a.id - b.id);
            container.innerHTML = "";
            notes.forEach(note => {
                const div = document.createElement("div");
                div.className = "msg";
                if (note.text) {
                    const t = document.createElement("div");
                    t.textContent = note.text;
                    div.appendChild(t);
                }
                if (note.link && isSafeUrl(note.link)) {
                    const a = document.createElement("a");
                    a.href = note.link;
                    a.target = "_blank";
                    a.rel = "noopener noreferrer";
                    a.textContent = note.link;
                    div.appendChild(a);
                }
                if (note.image && /^data:image\//.test(note.image)) {
                    const img = document.createElement("img");
                    img.src = note.image;
                    div.appendChild(img);
                }
                container.appendChild(div);
            });
            container.scrollTop = container.scrollHeight;
        }

        async function saveLocal(note) {
            await putNotes([note]);
            await renderNotes();
            scheduleSync();
        }

        // ===== Notas =====
        function addTextNote() {
            const input = $("text-input");
            const text = input.value.trim();
            if (!text) return;
            const m = text.match(/https?:\/\/[^\s]+/);
            saveLocal({ id: Date.now(), text, link: m ? m[0] : null, image: null });
            input.value = "";
        }

        function handleImage(input) {
            if (!input.files || !input.files[0]) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                saveLocal({ id: Date.now(), text: null, link: null, image: e.target.result });
                input.value = "";
            };
            reader.readAsDataURL(input.files[0]);
        }

        // ===== Estado =====
        function setStatus(msg) { $("status").textContent = msg; }
        function showConnected(on) {
            $("btn-login").style.display = on ? "none" : "inline-block";
            $("btn-sync").style.display = on ? "inline-block" : "none";
        }

        // ===== Google Auth =====
        let tokenExpiry = 0;
        let tokenPending = null;

        function initGoogleAuth() {
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID,
                scope: SCOPES,
                callback: (resp) => {
                    if (resp.error) {
                        tokenPending && tokenPending.reject(new Error(resp.error));
                    } else {
                        accessToken = resp.access_token;
                        tokenExpiry = Date.now() + ((resp.expires_in || 3600) - 120) * 1000;
                        localStorage.setItem("drive_consented", "1");
                        tokenPending && tokenPending.resolve();
                    }
                    tokenPending = null;
                },
                error_callback: (err) => {
                    tokenPending && tokenPending.reject(new Error((err && err.type) || "auth_error"));
                    tokenPending = null;
                }
            });
            // Reconexión silenciosa al abrir la app
            if (localStorage.getItem("drive_consented") === "1") {
                connectSilently().then(ok => { if (ok) syncWithDrive(false); });
            } else {
                setStatus("Sin conectar");
            }
        }

        function requestToken(prompt) {
            return new Promise((resolve, reject) => {
                tokenPending = { resolve, reject };
                tokenClient.requestAccessToken({ prompt });
            });
        }

        async function connectSilently() {
            if (!tokenClient) return false;
            if (accessToken && Date.now() < tokenExpiry) return true;
            try {
                await requestToken("none");
                showConnected(true);
                return true;
            } catch (e) {
                console.warn("Reconexión silenciosa fallida:", e.message);
                accessToken = null;
                showConnected(false);
                $("btn-login").textContent = "Reconectar Drive";
                setStatus("Toca «Reconectar Drive»");
                return false;
            }
        }

        // Clic del usuario (necesario para poder abrir el popup en móvil)
        async function handleAuthClick() {
            if (!tokenClient) return alert("La API de Google aún no está lista (¿sin conexión?).");
            try {
                const consented = localStorage.getItem("drive_consented") === "1";
                await requestToken(consented ? "" : "consent");
                showConnected(true);
                syncWithDrive(true);
            } catch (e) {
                if (e.message !== "popup_closed") alert("No se pudo conectar con Google: " + e.message);
            }
        }

        function loadGoogleLibrary() {
            const s = document.createElement("script");
            s.src = "https://accounts.google.com/gsi/client";
            s.async = true;
            s.onload = initGoogleAuth;
            s.onerror = () => { console.warn("No se pudo cargar Google (¿sin conexión?)"); setStatus("Sin conexión"); };
            document.head.appendChild(s);
        }

        // ===== Drive =====
        async function driveFetch(url, options = {}) {
            const res = await fetch(url, {
                ...options,
                headers: { ...(options.headers || {}), Authorization: `Bearer ${accessToken}` }
            });
            if (res.status === 401) {
                accessToken = null;
                tokenExpiry = 0;
                throw new Error("TOKEN_EXPIRED");
            }
            if (!res.ok) throw new Error(`Drive ${res.status}: ${await res.text()}`);
            return res;
        }

        let syncTimer = null;
        let syncPending = false;

        // Sincroniza poco después de un cambio (agrupa varios)
        function scheduleSync(delay = 800) {
            clearTimeout(syncTimer);
            syncTimer = setTimeout(() => syncWithDrive(false), delay);
        }

        async function syncWithDrive(manual = true, retried = false) {
            if (syncing) { syncPending = true; return; }
            if (!navigator.onLine) { setStatus("Sin conexión · pendiente de sincronizar"); return; }

            if (!accessToken || Date.now() >= tokenExpiry) {
                const ok = await connectSilently();
                if (!ok) {
                    if (manual) alert("Primero conéctate a Google Drive");
                    return;
                }
            }

            syncing = true;
            const btn = $("btn-sync");
            btn.disabled = true;
            btn.textContent = "🔄 Sincronizando...";
            setStatus("Sincronizando...");

            try {
                const localNotes = await getAllNotes();

                // 1. Buscar TODOS los backup.json (puede haber duplicados)
                const q = encodeURIComponent("name='backup.json'");
                const list = await (await driveFetch(
                    `${DRIVE}/files?q=${q}&spaces=appDataFolder&orderBy=createdTime&fields=files(id,name)`
                )).json();
                const files = list.files || [];
                let fileId = files.length ? files[0].id : null;

                // 2. Descargar y juntar las notas de todos ellos
                const map = new Map();
                for (const f of files) {
                    try {
                        const dl = await driveFetch(`${DRIVE}/files/${f.id}?alt=media`);
                        const arr = await dl.json();
                        if (Array.isArray(arr)) arr.forEach(n => { if (n && n.id) map.set(n.id, n); });
                    } catch (e) {
                        if (e.message === "TOKEN_EXPIRED") throw e;
                        console.warn("No se pudo leer", f.id, e);
                    }
                }
                localNotes.forEach(n => { if (n && n.id) map.set(n.id, n); });
                const merged = Array.from(map.values());

                // 3. Guardar fusionado en local
                await putNotes(merged);

                // 4. Crear archivo si no existe
                if (!fileId) {
                    const created = await (await driveFetch(`${DRIVE}/files`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ name: "backup.json", parents: ["appDataFolder"] })
                    })).json();
                    fileId = created.id;
                }

                // 5. Subir contenido al archivo principal
                await driveFetch(`${UPLOAD}/files/${fileId}?uploadType=media`, {
                    method: "PATCH",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(merged)
                });

                // 6. Borrar duplicados (ya fusionados)
                for (const f of files.slice(1)) {
                    try { await driveFetch(`${DRIVE}/files/${f.id}`, { method: "DELETE" }); } catch (e) { console.warn(e); }
                }

                await renderNotes();
                const hora = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
                btn.textContent = "✅ Sincronizado";
                setStatus(`Sincronizado ${hora} · ${merged.length} notas`);
            } catch (err) {
                console.error("Error en la sincronización:", err);
                btn.textContent = "🔄 Sincronizar";
                if (err.message === "TOKEN_EXPIRED" && !retried) {
                    syncing = false;
                    btn.disabled = false;
                    return syncWithDrive(manual, true);
                }
                setStatus("Error: " + err.message.slice(0, 80));
                if (manual) alert("Error durante la sincronización:\n" + err.message);
            } finally {
                syncing = false;
                btn.disabled = false;
                if (syncPending) { syncPending = false; scheduleSync(300); }
            }
        }

        // ===== Arranque =====
        (async function init() {
            $("btn-login").addEventListener("click", handleAuthClick);
            $("btn-sync").addEventListener("click", () => syncWithDrive(true));
            $("btn-send").addEventListener("click", addTextNote);
            $("btn-file").addEventListener("click", () => $("file-input").click());
            $("file-input").addEventListener("change", (e) => handleImage(e.target));
            $("text-input").addEventListener("keydown", (e) => { if (e.key === "Enter") addTextNote(); });

            try {
                db = await openDB();
                await renderNotes();
            } catch (e) {
                console.error("Error IndexedDB:", e);
                alert("No se pudo abrir la base de datos local.");
            }
            loadGoogleLibrary();

            // Sincronización automática
            document.addEventListener("visibilitychange", () => {
                if (document.visibilityState === "visible" && accessToken) scheduleSync(300);
            });
            window.addEventListener("online", () => scheduleSync(300));
            setInterval(() => {
                if (document.visibilityState === "visible" && accessToken) syncWithDrive(false);
            }, 30000);

            if ("serviceWorker" in navigator) {
                navigator.serviceWorker.register("sw.js").catch(err => console.error("SW error:", err));
            }
        })();
    </script>
</body>
</html>
